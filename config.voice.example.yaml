# Voice agent config. Copy to config.voice.local.yaml (gitignored) to override.
# Relative paths resolve against the current working directory, falling back to
# the repo root when missing there; "~" is expanded.
vault: ~/path/to/your/vault
model: claude-opus-5-5
wake_threshold: 0.5
wake_models_dir: models/wakeword
stt_model: mlx-community/whisper-large-v3-turbo
vocab_file: vocab.local.txt
self_chat_id: null
tts_voice: bm_daniel
# How the assistant addresses you in replies; empty string for no form of address.
address_as: sir
kokoro_model: models/kokoro/kokoro-v1.0.onnx
kokoro_voices: models/kokoro/voices-v1.0.bin
smart_turn_model: models/smart_turn/smart-turn-v3.2-cpu.onnx
room_api_url: http://127.0.0.1:8790
followup_s: 8.0
hard_silence_s: 3.0
max_utterance_s: 30.0
working_tone_after_s: 3.0
turn_timeout_s: 180.0
idle_reset_s: 600.0
data_dir: ~/.jarvis/voice
input_device: null
output_device: null
