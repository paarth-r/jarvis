# Voice agent config. Copy to config.voice.local.yaml (gitignored) to override.
# Relative paths resolve against the current working directory, falling back to
# the repo root when missing there; "~" is expanded.
vault: ~/path/to/your/vault
model: claude-opus-5-5
wake_threshold: 0.5
wake_models_dir: models/wakeword
stt_model: mlx-community/whisper-large-v3-turbo
vocab_file: vocab.local.txt
self_chat_id: null
tts_voice: bm_daniel
# How the assistant addresses you in replies; empty string for no form of address.
address_as: sir
# Claude Code permission mode. In "auto" its classifier vets tool calls and the
# voice only asks before reaching other people or deleting; "default" asks more.
permission_mode: auto
# Spotify search for the real room server (jarvis-room). Put these in your
# gitignored local config: client id + secret from developer.spotify.com.
spotify_client_id: null
spotify_client_secret: null
kokoro_model: models/kokoro/kokoro-v1.0.onnx
kokoro_voices: models/kokoro/voices-v1.0.bin
smart_turn_model: models/smart_turn/smart-turn-v3.2-cpu.onnx
room_api_url: http://127.0.0.1:8790
followup_s: 8.0
# End of speech: the smart-turn model is asked whether you're done after a pause of
# pause_check_s, and again every 0.3 s while the pause lasts (a short pause needs a
# confident "done"); hard_silence_s of silence ends the turn regardless.
hard_silence_s: 3.0
pause_check_s: 0.24
max_utterance_s: 30.0
working_tone_after_s: 3.0
turn_timeout_s: 180.0
idle_reset_s: 600.0
# Lower Spotify / Music app volume to duck_ratio of its level while Jarvis is engaged.
duck_music: true
duck_ratio: 0.2
data_dir: ~/.jarvis/voice
input_device: null
output_device: null
