# Jarvis runtime configuration

# Per-camera MediaPipe hand detection tuning (applied to every HandPoseModule).
hand_pose:
  detection_confidence: 0.5   # lower = detects more readily; tune up for color if needed
  tracking_confidence: 0.6

# ACTIVE RIG: color stereo pair (replaced the mono OV9281s).
# TODO(calibration): the intrinsics/distortion below are the OLD MONO calibration
#   reused as placeholders. 3D shape is right but metric depth is approximate until
#   the color pair is charuco-calibrated. Replace fx/fy/cx/cy + distortion then.
# TODO(devices): confirm the color cameras' device indices when connected — the
#   indices below were the mono mapping and may differ for the color rig.
cameras:
  left:
    device: 1             # CONFIRM for color rig (was mono stereo_left)
    width: 1280
    height: 800
    fps: 120
    intrinsics:           # PLACEHOLDER (mono stereo_left.json) — recalibrate for color
      fx: 906.667
      fy: 908.358
      cx: 611.627
      cy: 391.546
    # distortion k1,k2,p1,p2,k3: [0.045728, -0.073574, 0.000416, -0.001328, 0.012644]
    # NOTE: StereoFusionModule does not undistort yet — add before trusting metric depth.
    extrinsics:           # camera-to-world; identity R assumed (no stereo_extrinsics.json yet)
      R: [[1,0,0],[0,1,0],[0,0,1]]
      t: [-0.0762, 0, 0]  # meters; baseline 0.1524 m (6"), left at -B/2
  right:
    device: 0             # CONFIRM for color rig (was mono stereo_right)
    width: 1280
    height: 800
    fps: 120
    intrinsics:           # PLACEHOLDER (mono stereo_right.json) — recalibrate for color
      fx: 906.292
      fy: 907.944
      cx: 619.908
      cy: 386.792
    # distortion k1,k2,p1,p2,k3: [0.044784, -0.071240, -0.0000363, -0.001105, 0.016704]
    extrinsics:           # camera-to-world; identity R assumed (no stereo_extrinsics.json yet)
      R: [[1,0,0],[0,1,0],[0,0,1]]
      t: [0.0762, 0, 0]   # meters; baseline 0.1524 m (6"), right at +B/2

modules:
  stereo_fusion:
    class: jarvis.modules.stereo_fusion.StereoFusionModule
    sync_tolerance_ms: 16.0
    mono_fallback: true
    mono_depth_m: 0.5
  gesture_hci:
    class: jarvis.modules.gesture_hci.GestureHCIModule
    smoothing: 0.3
    move_threshold_px: 2.0
    screen_gain: 2.5
    pinch_thresh_m: 0.025
    release_thresh_m: 0.045
  action_dispatcher:
    class: jarvis.modules.action_dispatcher.ActionDispatcher
    cooldown_s: 1.0
  visualizer:
    class: jarvis.modules.visualizer.VisualizerModule
    enabled: false        # opt-in; set true to show windows
    show_2d: true
    show_3d: true
    fps: 30

subprocesses:
  arm:
    enabled: false
    module: jarvis.processes.arm_controller
  llm:
    enabled: false
    module: jarvis.processes.llm_agent
