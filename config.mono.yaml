# Jarvis mono (single-camera) mouse-control configuration.
# Uses one camera — by default the Mac's built-in webcam (device 0).
# StereoFusion mono-projects each hand at a fixed assumed depth (mono_depth_m),
# so cursor XY tracking works but metric depth is approximate; pinch thresholds
# below are the same as stereo and may need loosening if clicks feel unreliable.

hand_pose:
  detection_confidence: 0.5
  tracking_confidence: 0.6

cameras:
  main:
    device: 0             # built-in FaceTime camera; bump if an external cam grabs index 0
    width: 1280
    height: 720
    fps: 30
    intrinsics:           # PLACEHOLDER pinhole for FaceTime HD @ 1280x720 (~60 deg HFOV)
      fx: 1000.0
      fy: 1000.0
      cx: 640.0
      cy: 360.0
    distortion: []        # none — uncalibrated
    extrinsics:           # camera at world origin
      R: [[1,0,0],[0,1,0],[0,0,1]]
      t: [0, 0, 0]

modules:
  stereo_fusion:
    class: jarvis.modules.stereo_fusion.StereoFusionModule
    sync_tolerance_ms: 16.0
    mono_fallback: true
    mono_depth_m: 0.5     # assumed hand distance from camera, metres
  gesture_hci:
    class: jarvis.modules.gesture_hci.GestureHCIModule
    mode: box             # box = hand position is the cursor, from a small hand box (recommended)
                          # absolute = legacy hand-position mapping (screen_gain)
                          # trackpad = hand motion moves the cursor, with acceleration; fist = clutch
    box:                  # box-mode tuning (lengths are metres at mono_depth_m)
      box_width_m: 0.192  # hand travel for the full screen width — smaller = less movement
      box_height_m: 0.12  # hand travel for the full screen height
      min_cutoff: 0.3     # 1-euro Hz at rest — lower = steadier when holding still
      beta: 10.0          # 1-euro — higher = less lag in fast moves
    trackpad:             # trackpad-mode tuning (ignored in box mode)
      gain_min: 1500.0
      gain_max: 40000.0
      speed_lo: 0.03
      speed_hi: 0.35
      deadzone_mps: 0.005
      min_cutoff: 1.0
      beta: 10.0
    # absolute-mode settings (ignored in box/trackpad modes; move_threshold_px also applies to box)
    smoothing: 0.3
    move_threshold_px: 2.0
    screen_gain: 2.5
    pinch_thresh_m: 0.025
    release_thresh_m: 0.045
    drag_hold_s: 0.2
    gestures:             # one gesture at a time: a pose must be held this long to count
      dwell_s: 0.15       # custom gestures
      release_s: 0.1      # an active gesture survives tracking dropouts this short
      dwell: {fist: 0.1, point: 0.3}
    scroll:               # fist, then tilt: knuckles toward the camera = scroll down
      enabled: true
      deadzone_deg: 8.0   # tilt that does nothing
      full_deg: 35.0      # tilt that reaches max_px_s
      max_px_s: 2500.0
      curve: 1.5          # >1 = finer control near the dead zone
      smoothing: 0.4      # weight of the newest angle (1 = no smoothing)
      horizontal: false   # true = turning the forearm scrolls sideways
      invert_y: false
      invert_x: false
  pointing:
    class: jarvis.modules.pointing.PointingModule
    enabled: true
  action_dispatcher:
    class: jarvis.modules.action_dispatcher.ActionDispatcher
    cooldown_s: 1.0
    on_point_action: raycast   # point gesture -> cmd+space
    # Gesture -> action bindings live in ~/.jarvis/gestures.json (edit them in
    # the gesture studio; picked up live) and override these defaults.
    # bindings: {point: {type: keys, combo: "cmd+space"}}
  visualizer:
    class: jarvis.modules.visualizer.VisualizerModule
    enabled: false        # set true to watch detection windows
    show_2d: true
    show_3d: false

subprocesses:
  arm:
    enabled: false
    module: jarvis.processes.arm_controller
  llm:
    enabled: false
    module: jarvis.processes.llm_agent
